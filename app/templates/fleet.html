{% extends "base.html" %}

{% block title %}Frota - AtlasERP{% endblock %}

{% block content %}
<h1>Frota</h1>
<p>Tela de frota carregada.</p>

<button id="reload-button">
    Atualizar
</button>

<div id="status">
    Carregando veículos...
</div>

<table>
<thead>
<tr>
<th>Placa</th>
<th>Tipo</th>
<th>Marca</th>
<th>Modelo</th>
</tr>
</thead>
<tbody id="vehicles-table">
</tbody>
</table>

<script>
const table = document.getElementById("vehicles-table");
const status = document.getElementById("status");
const button = document.getElementById("reload-button");

async function loadVehicles() {
    try {
        const response = await fetch("/fleet/vehicles");
        const data = await response.json();
        const items = Array.isArray(data) ? data : data.vehicles || [];
        table.innerHTML = items.map(function (vehicle) {
            return "<tr><td>" + (vehicle.plate || "") + "</td><td>" + (vehicle.vehicle_type || "") + "</td><td>" + (vehicle.brand || "") + "</td><td>" + (vehicle.model || "") + "</td></tr>";
        }).join("");
        status.textContent = "Veículos carregados.";
    } catch (error) {
        status.textContent = error.message;
    }
}

button.addEventListener("click", loadVehicles);
loadVehicles();
</script>
{% endblock %}
